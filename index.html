<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>Визиты · Отдел продаж</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1c2530; --muted:#66707c;
    --line:#e3e7ec; --brand:#1f6feb; --brand-ink:#fff;
    --ok:#1a7f37; --warn:#b45309; --danger:#cf222e; --chip:#eef1f5;
    --shadow:0 1px 3px rgba(20,30,45,.08),0 6px 18px rgba(20,30,45,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1319;--card:#171c24;--ink:#e7ecf2;--muted:#9aa4b1;
      --line:#262d38;--chip:#1f2732;--shadow:0 1px 3px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);
    padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;
    align-items:center;gap:10px;box-shadow:var(--shadow)}
  header .back{background:rgba(255,255,255,.18);border:0;color:#fff;width:34px;height:34px;
    border-radius:9px;font-size:20px;line-height:1;cursor:pointer;flex:0 0 auto}
  header h1{font-size:17px;margin:0;font-weight:650;flex:1}
  header .step{font-size:13px;opacity:.85}
  main{padding:16px;max-width:640px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  h2{font-size:15px;margin:0 0 12px;letter-spacing:.01em}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  textarea{min-height:70px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    border:0;border-radius:12px;padding:14px;font:inherit;font-weight:650;
    background:var(--brand);color:var(--brand-ink);cursor:pointer;margin-top:6px}
  .btn.sec{background:var(--chip);color:var(--ink)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);
    border-radius:999px;padding:5px 11px;font-size:13px;margin:0 6px 6px 0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:8px 13px;font-size:14px;cursor:pointer;user-select:none}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .visit{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);
    background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
  .visit .ico{width:42px;height:42px;border-radius:11px;background:var(--chip);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
  .visit .t{font-weight:600;font-size:15px}
  .visit .s{font-size:12.5px;color:var(--muted);margin-top:2px}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
  .badge.sent{background:rgba(26,127,55,.14);color:var(--ok)}
  .badge.local{background:rgba(180,83,9,.14);color:var(--warn)}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--chip)}
  .photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .photos .ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;
    border:0;width:22px;height:22px;border-radius:50%;font-size:14px;cursor:pointer}
  .photos .ph .n{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);
    color:#fff;font-size:10px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .add-ph{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;background:transparent;
    color:var(--muted);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .menu-item{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;
    border-bottom:1px solid var(--line);cursor:pointer}
  .menu-item:last-child{border-bottom:0}
  .menu-item .cnt{font-size:13px;color:var(--muted)}
  .menu-item .cnt.has{color:var(--brand);font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .empty .big{font-size:44px;margin-bottom:8px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2530;
    color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:50;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:.97}
  .gps{display:flex;gap:10px;align-items:center;background:var(--chip);border-radius:12px;padding:12px}
  .gps .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:0 0 auto}
  .gps .dot.ok{background:var(--ok)}
  .fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);
    background:var(--brand);color:#fff;border:0;border-radius:16px;padding:15px 20px;
    font-weight:700;font-size:15px;box-shadow:var(--shadow);cursor:pointer;z-index:20}
  .stepbar{display:flex;gap:4px;margin-bottom:14px}
  .stepbar i{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .stepbar i.on{background:var(--brand)}
  hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<header>
  <button class="back" id="back" style="display:none">‹</button>
  <h1 id="title">Мои визиты</h1>
  <span class="step" id="stepLabel"></span>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ---------- Справочники анкеты (data-driven, легко расширять) ---------- */
const EQUIP = {
  "Раскрой":["Форматно-раскроечный (с кареткой)","Пильный центр с ЧПУ","Нестинг-центр","Ленточнопильный"],
  "Кромкооблицовка":["Автоматический станок","Криволинейный","Ручной фрезер / обрезчик свесов"],
  "Присадка и сверление":["Сверлильно-присадочный","Многошпиндельный","Пазовально-фрезерный"],
  "ЧПУ и фрезеровка":["Обрабатывающий центр ЧПУ","Фрезерный","Гравировально-фрезерный"],
  "Облицовка и прессы":["Мембранно-вакуумный пресс","Пресс горячего склеивания (HPL)","Пресс холодного склеивания","Ваймы для щита","Линия ламинирования"],
  "Шлифовка":["Калибровально-шлифовальный","Широколенточный","Ручной / осцилляционный"],
  "Покраска":["Покрасочная камера","Сушильная камера","Лаконаливная машина","Линия покраски","УФ-линия"],
  "Обработка массива":["Рейсмусовый","Фуговальный","Четырёхсторонний","Токарный по дереву"],
  "Сборка и упаковка":["Сборочные столы","Пресс сборки корпусов","Упаковочная линия"],
  "Вспомогательное":["Аспирация","Компрессор","Кран-балка / подъёмник","Стеллажи для плиты"]
};
const NOM = ["ЛДСП","Кромка","БСП (пластик HPL)","МДФ","Фасадные плиты","Столешницы","Фурнитура"];
const RESULT = ["Перспективный","Думают","Отказ","Нужна доработка КП"];

/* ---------- Хранилище ---------- */
const DB = {
  all(){ try{return JSON.parse(localStorage.getItem('visits')||'[]')}catch(e){return[]} },
  save(v){ const a=DB.all(); const i=a.findIndex(x=>x.id===v.id);
    if(i>=0)a[i]=v; else a.unshift(v); localStorage.setItem('visits',JSON.stringify(a)); },
  get(id){ return DB.all().find(v=>v.id===id) },
  del(id){ localStorage.setItem('visits',JSON.stringify(DB.all().filter(v=>v.id!==id))); }
};

/* ---------- Состояние ---------- */
let view={name:'list'}, cur=null;

/* Черновик: визит переживает перезагрузку страницы (телефон заблокировался,
   браузер выгрузил вкладку). Сохраняем на каждом изменении. */
function saveDraft(){ if(cur) try{localStorage.setItem('draft',JSON.stringify({cur,view}))}catch(e){} }
function clearDraft(){ localStorage.removeItem('draft'); }
function restoreDraft(){
  try{
    const d=JSON.parse(localStorage.getItem('draft')||'null');
    if(d && d.cur){ cur=d.cur; view=d.view && d.view.name!=='list' ? d.view : {name:'step',i:0}; return true; }
  }catch(e){}
  return false;
}
/* Любая ошибка — на экран и в лог сервера (удалённая диагностика) */
const APP_V='5';
function beacon(tag,msg){ try{ fetch('/__log/'+tag+'?v='+APP_V+'&m='+encodeURIComponent((msg||'').slice(0,300))).catch(()=>{});}catch(e){} }
window.addEventListener('error',e=>{ toast('Ошибка: '+e.message); beacon('err', e.message+' @'+(e.filename||'')+':'+(e.lineno||'')); });
window.addEventListener('unhandledrejection',e=>{ beacon('rej', String(e.reason)); });
beacon('open', navigator.userAgent);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1900);}
function fmtDate(ts){const d=new Date(ts);return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}

/* ---------- Навигация ---------- */
function go(v){ view=v; saveDraft(); render(); window.scrollTo(0,0); }
function newVisit(){
  cur={ id:'v'+Date.now(), created:Date.now(), status:'local',
    gps:null, address:'', company:'', inn:'', contact:'', phone:'',
    photos:[], equip:{}, needs:{}, result:'', next:'', comment:'' };
  go({name:'step',i:0});
}

/* ---------- GPS ---------- */
function getGPS(){
  const box=$('#gpsBox'); if(!navigator.geolocation){box.querySelector('.txt').textContent='GPS не поддерживается';return;}
  box.querySelector('.txt').textContent='Определяю координаты…';
  navigator.geolocation.getCurrentPosition(async p=>{
    cur.gps={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)};
    box.querySelector('.dot').classList.add('ok');
    box.querySelector('.txt').innerHTML=`${cur.gps.lat}, ${cur.gps.lng} · ±${cur.gps.acc} м`;
    // Обратное геокодирование (нужен интернет; офлайн — просто останутся координаты)
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${cur.gps.lat}&lon=${cur.gps.lng}&accept-language=ru`);
      const j=await r.json(); if(j.display_name){cur.address=j.display_name; const inp=$('#addr'); if(inp)inp.value=j.display_name;}
    }catch(e){/* офлайн — ок */}
  },err=>{ box.querySelector('.txt').textContent='Не удалось получить GPS ('+err.message+')'; },
  {enableHighAccuracy:true,timeout:10000,maximumAge:0});
}

/* ---------- Фото ---------- */
function addPhoto(input){
  const f=input.files[0]; if(!f)return;
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{
    // сжатие до ~1280px, чтобы не раздувать хранилище
    const max=1280, sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=img.width*sc; c.height=img.height*sc;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL('image/jpeg',0.7);
    const note=prompt('Что на фото? (офис / цех / оборудование / заметка)','')||'';
    cur.photos.push({data,note,gps:cur.gps}); input.value=''; render();
  }; img.src=rd.result; };
  rd.readAsDataURL(f);
}

/* ---------- Рендер ---------- */
function render(){
  const back=$('#back');
  back.style.display = view.name==='list' ? 'none':'inline-block';
  back.onclick=()=>{
    if(view.name==='step' && view.i>0) go({name:'step',i:view.i-1});
    else if(view.name==='equip'||view.name==='need') go({name:'step',i:view.name==='equip'?3:4});
    else if(view.name==='step' && view.i===0){
      if(confirm('Выйти из визита? Черновик будет удалён.')){ clearDraft(); cur=null; go({name:'list'}); }
    }
    else go({name:'list'});
  };
  $('#stepLabel').textContent = view.name==='step' ? `${view.i+1} / 6` : '';
  if(view.name==='list') return renderList();
  if(view.name==='view') return renderView();
  if(view.name==='equip') return renderEquip();
  if(view.name==='need') return renderNeed();
  renderStep();
}

function renderList(){
  $('#title').textContent='Мои визиты';
  $('#stepLabel').textContent='v'+APP_V;
  const v=DB.all();
  app.innerHTML = v.length? v.map(x=>`
    <div class="visit" onclick="go({name:'view',id:'${x.id}'})">
      <div class="ico">📍</div>
      <div style="flex:1;min-width:0">
        <div class="t">${esc(x.company)||'Без названия'}</div>
        <div class="s">${fmtDate(x.created)} · фото: ${x.photos.length}${x.gps?' · GPS ✓':''}</div>
      </div>
      <span class="badge ${x.status==='sent'?'sent':'local'}">${x.status==='sent'?'В CRM':'Локально'}</span>
    </div>`).join('')
    : `<div class="empty"><div class="big">🗺️</div>Пока нет визитов.<br>Нажмите «Новый визит», чтобы начать.</div>`;
  app.innerHTML += `<button class="fab" onclick="newVisit()">＋ Новый визит</button>`;
}

function stepbar(i){return `<div class="stepbar">${[0,1,2,3,4,5].map(n=>`<i class="${n<=i?'on':''}"></i>`).join('')}</div>`}

function renderStep(){
  const i=view.i; $('#title').textContent='Новый визит';
  let html=stepbar(i);
  if(i===0){ html+=`
    <div class="card"><h2>📍 Местоположение</h2>
      <div class="gps" id="gpsBox"><span class="dot ${cur.gps?'ok':''}"></span>
        <span class="txt" style="flex:1">${cur.gps?`${cur.gps.lat}, ${cur.gps.lng} · ±${cur.gps.acc} м`:'Координаты не получены'}</span></div>
      <button class="btn sec" onclick="getGPS()">Определить по GPS</button>
      <label>Адрес клиента (по координатам, можно поправить)</label>
      <input id="addr" value="${esc(cur.address)}" oninput="cur.address=this.value" placeholder="Адрес появится после GPS">
    </div>`;
  }
  if(i===1){ html+=`
    <div class="card"><h2>🏢 Клиент</h2>
      <label>Название компании</label><input value="${esc(cur.company)}" oninput="cur.company=this.value">
      <label>ИНН</label><input inputmode="numeric" value="${esc(cur.inn)}" oninput="cur.inn=this.value">
      <hr><h2>👤 Контактное лицо</h2>
      <label>ФИО</label><input value="${esc(cur.contact)}" oninput="cur.contact=this.value">
      <label>Телефон</label><input inputmode="tel" value="${esc(cur.phone)}" oninput="cur.phone=this.value">
    </div>`;
  }
  if(i===2){ html+=`
    <div class="card"><h2>📷 Фотофиксация</h2>
      <div class="muted">Офис, цех, оборудование. К каждому фото — заметка и геометка.</div>
      <div class="photos">
        ${cur.photos.map((p,n)=>`<div class="ph"><img src="${p.data}">
          <button class="x" onclick="cur.photos.splice(${n},1);render()">×</button>
          <div class="n">${esc(p.note)||'—'}</div></div>`).join('')}
        <label class="add-ph">＋<input type="file" accept="image/*" capture="environment" style="display:none" onchange="addPhoto(this)"></label>
      </div>
    </div>`;
  }
  if(i===3){
    const sel=Object.keys(cur.equip).reduce((s,k)=>s+(cur.equip[k]?.items?.length||0),0);
    html+=`<div class="card"><h2>⚙️ Оборудование цеха</h2>
      <div class="muted">Выбрано позиций: <b>${sel}</b></div>
      ${Object.keys(EQUIP).map(g=>{const c=cur.equip[g]?.items?.length||0;
        return `<div class="menu-item" onclick="go({name:'equip',g:'${esc(g)}'})">
          <span>${g}</span><span class="cnt ${c?'has':''}">${c?('выбрано: '+c):'›'}</span></div>`}).join('')}
    </div>`;
  }
  if(i===4){
    html+=`<div class="card"><h2>📦 Потребность по номенклатуре</h2>
      <div class="muted">Отметьте, что интересует клиента, — детали внутри.</div>
      ${NOM.map(n=>{const has=cur.needs[n];
        return `<div class="menu-item" onclick="go({name:'need',n:'${esc(n)}'})">
          <span>${n}</span><span class="cnt ${has?'has':''}">${has?('✓ '+(has.vol?has.vol+' /мес':'отмечено')):'›'}</span></div>`}).join('')}
    </div>`;
  }
  if(i===5){ html+=`
    <div class="card"><h2>🏁 Итог визита</h2>
      <label>Результат встречи</label>
      <div class="chips">${RESULT.map(r=>`<div class="chip ${cur.result===r?'on':''}" onclick="cur.result='${r}';render()">${r}</div>`).join('')}</div>
      <label>Следующий шаг</label><input value="${esc(cur.next)}" oninput="cur.next=this.value" placeholder="Напр.: выслать КП до пятницы">
      <label>Комментарий</label><textarea oninput="cur.comment=this.value">${esc(cur.comment)}</textarea>
    </div>`;
  }
  // навигация
  html+=`<div class="row">
    ${i>0?`<button class="btn ghost" onclick="go({name:'step',i:${i-1}})">Назад</button>`:''}
    ${i<5?`<button class="btn" onclick="go({name:'step',i:${i+1}})">Далее</button>`
         :`<button class="btn" onclick="finish()">✓ Сохранить визит</button>`}
  </div>`;
  app.innerHTML=html;
}

function renderEquip(){
  const g=view.g; $('#title').textContent=g;
  const st=cur.equip[g]||(cur.equip[g]={items:[]});
  app.innerHTML=`<div class="card"><h2>${g}</h2>
    <div class="chips">
      ${EQUIP[g].map(it=>`<div class="chip ${st.items.includes(it)?'on':''}"
        onclick="toggleEquip('${esc(g)}','${esc(it).replace(/'/g,"\\'")}')">${it}</div>`).join('')}
    </div>
    <div class="chips" style="margin-top:6px">
      <div class="chip ${st.none?'on':''}" onclick="cur.equip['${esc(g)}'].none=!cur.equip['${esc(g)}'].none;render()">Нет такого</div>
    </div>
    <button class="btn" onclick="go({name:'step',i:3})">Готово</button></div>`;
}
function toggleEquip(g,it){const s=cur.equip[g];const k=s.items.indexOf(it);
  if(k>=0)s.items.splice(k,1);else{s.items.push(it);s.none=false} render();}

function renderNeed(){
  const n=view.n; $('#title').textContent=n;
  const st=cur.needs[n]||{};
  app.innerHTML=`<div class="card"><h2>${n}</h2>
    <label>Интересует?</label>
    <div class="chips">
      <div class="chip ${cur.needs[n]?'on':''}" onclick="cur.needs['${esc(n)}']=cur.needs['${esc(n)}']||{};render()">Да</div>
      <div class="chip ${!cur.needs[n]?'on':''}" onclick="delete cur.needs['${esc(n)}'];render()">Нет</div>
    </div>
    ${cur.needs[n]?`
      <label>Объём в месяц</label><input value="${esc(st.vol||'')}" oninput="cur.needs['${esc(n)}'].vol=this.value" placeholder="напр. 200 листов">
      <label>Текущий поставщик</label><input value="${esc(st.supplier||'')}" oninput="cur.needs['${esc(n)}'].supplier=this.value">
      <label>Комментарий</label><textarea oninput="cur.needs['${esc(n)}'].note=this.value">${esc(st.note||'')}</textarea>
    `:''}
    <button class="btn" onclick="go({name:'step',i:4})">Готово</button></div>`;
}

function finish(){
  cur.created=cur.created||Date.now(); DB.save(cur); clearDraft();
  toast('Визит сохранён на устройстве'); go({name:'list'});
}

function renderView(){
  const v=DB.get(view.id); if(!v)return go({name:'list'});
  $('#title').textContent=v.company||'Визит';
  const needs=Object.keys(v.needs);
  const equip=Object.keys(v.equip).filter(g=>v.equip[g].items?.length);
  app.innerHTML=`
   <div class="card">
     <span class="badge ${v.status==='sent'?'sent':'local'}">${v.status==='sent'?'В CRM':'Локально'}</span>
     <h2 style="margin-top:10px">🏢 ${esc(v.company)||'—'}</h2>
     <div class="muted">ИНН ${esc(v.inn)||'—'} · ${fmtDate(v.created)}</div>
     <p>${esc(v.contact)} · ${esc(v.phone)}</p>
     ${v.gps?`<div class="pill">📍 ${v.gps.lat}, ${v.gps.lng}</div>`:''}
     ${v.address?`<div class="muted">${esc(v.address)}</div>`:''}
   </div>
   ${v.photos.length?`<div class="card"><h2>Фото (${v.photos.length})</h2>
     <div class="photos">${v.photos.map(p=>`<div class="ph"><img src="${p.data}"><div class="n">${esc(p.note)||'—'}</div></div>`).join('')}</div></div>`:''}
   ${equip.length?`<div class="card"><h2>Оборудование</h2>${equip.map(g=>`<b>${g}:</b> ${v.equip[g].items.map(esc).join(', ')}<br>`).join('')}</div>`:''}
   ${needs.length?`<div class="card"><h2>Потребность</h2>${needs.map(n=>`<div class="pill">${n}${v.needs[n].vol?' · '+esc(v.needs[n].vol):''}</div>`).join('')}</div>`:''}
   <div class="card"><h2>Итог</h2><p><b>${esc(v.result)||'—'}</b></p>
     <p class="muted">След. шаг: ${esc(v.next)||'—'}</p>${v.comment?`<p>${esc(v.comment)}</p>`:''}</div>
   <button class="btn" onclick="sendToCRM('${v.id}')">⇪ Отправить в Битрикс24</button>
   <button class="btn sec" onclick="exportVisit('${v.id}')">Выгрузить JSON</button>
   <button class="btn ghost" onclick="if(confirm('Удалить визит?')){DB.del('${v.id}');go({name:'list'})}">Удалить</button>`;
}

function sendToCRM(id){
  // Заглушка интеграции: пока помечаем локально. Реальную отправку в коробочный
  // Битрикс24 (REST / вебхук) подключим на следующем шаге, когда будет доступ.
  const v=DB.get(id); v.status='sent'; DB.save(v);
  toast('Отмечено как отправленное (интеграция с Б24 — след. шаг)'); render();
}
function exportVisit(id){
  const v=DB.get(id); const blob=new Blob([JSON.stringify(v,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='visit-'+id+'.json'; a.click();
}

/* Автосохранение черновика при любом вводе (с небольшой задержкой) */
let _dt; app.addEventListener('input',()=>{clearTimeout(_dt);_dt=setTimeout(saveDraft,300);});
window.addEventListener('pagehide',saveDraft);

/* ---------- PWA ---------- */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
if(restoreDraft()) toast('Восстановлен незавершённый визит');
render();
</script>
</body>
</html>
